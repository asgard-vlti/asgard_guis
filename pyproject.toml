# For wag, you can: pip install .
# For mimir, i.e.: pip install -e . --no-index --find-links ~/Downloads
[project]
name = "asgard_guis"
version = "0.0.1"
readme = "README.md"
requires-python =">=3.8"
license = {file = "LICENSE"}
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
ob-creator = ["numpy", "astropy", "astroquery"]

[project.scripts] 
ob-creator = "asgard_guis.cmd_scripts.ob_creator:main"
temperature-watchdog = "asgard_guis.cmd_scripts.temperature_watchdog:main"
temperature-plotting = "asgard_guis.cmd_scripts.plot_temps:main"
mimir-startup = "asgard_guis.cmd_scripts.startup_mimir:main"
mimir-shutdown = "asgard_guis.cmd_scripts.shutdown_mimir:main"
read-all-pdu = "asgard_guis.cmd_scripts.read_all_pdu:main"
text-clients = "asgard_guis.cmd_scripts.universal_client:main"
im-search-gui = "asgard_guis.cmd_scripts.image_search_gui:main"
pu-search-gui = "asgard_guis.cmd_scripts.pupil_search_gui:main"
h-guis = "asgard_guis.cmd_scripts.Heimdallr_RTC_performance:main"
s-labmode = "asgard_guis.cmd_scripts.s_labmode:main"
s-skymode = "asgard_guis.cmd_scripts.s_skymode:main"
status-mimir = "asgard_guis.cmd_scripts.status:main"
logs-client = "asgard_guis.cmd_scripts.log_viewer:main"
shortcuts = "asgard_guis.cmd_scripts.shortcuts:main" 
baldr-faint-alignment = "asgard_guis.cmd_scripts.baldr_faint_alignment:main"
baldr-pupil-mask-alignment = "asgard_guis.cmd_scripts.baldr_pupil_mask_alignment:main"

[tool.hatch.build.targets.wheel]
packages = ["asgard_guis"]

[tool.hatch.build.targets.wheel.force-include]
"templates/no_coords_dynamical.ONAXIS.obd" = "asgard_guis/templates/no_coords_dynamical.ONAXIS.obd"
"asgard_guis/pdu.toml" = "asgard_guis/pdu.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
